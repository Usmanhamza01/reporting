<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13804b">
<meta name="description" content="Clôture J+10, indicateurs comptables, suivi de l’équipe et rapports pour le DFC et la Direction.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chef Comptable">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Pilotage Chef Comptable</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : un registre de clôture — bandeau d'en-tête sobre, onglets façon classeur, contenu en colonnes de grand livre. */
:root{
  --ink:#14211d;          /* texte principal, encre vert-noir */
  --paper:#f2f7f3;        /* fond légèrement verdi */
  --sheet:#ffffff;        /* surfaces */
  --rule:#dfe6e2;         /* filets */
  --muted:#5b6b65;        /* texte secondaire */
  --faint:#8c9a95;
  --ledger:#13804b;       /* vert de l’entreprise (modifiable dans Réglages) */
  --ledger-soft:color-mix(in srgb,var(--ledger) 13%,var(--sheet));
  --band:var(--ledger);   /* bandeau d’en-tête */
  --on-band:#ffffff;
  --s1:var(--ledger); --s2:#eb6834; --s3:#2a78d6;   /* séries de graphiques (palette validée daltonisme) */
  --ok:#1f7a45; --ok-bg:#e4f4ea;
  --warn:#a35a00; --warn-bg:#fdf1dc;
  --bad:#b42318; --bad-bg:#fdebe9;
  --font-display:'Archivo',ui-sans-serif,system-ui,sans-serif;
  --font-body:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-data:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e6eeea;--paper:#0f1513;--sheet:#161e1b;--rule:#26322e;--muted:#a3b2ac;--faint:#73827c;
  --ledger:#2fae6c;--band:#145c38;--s1:var(--ledger);--s2:#d95926;--s3:#3987e5;--ok:#5fd38f;--ok-bg:#163223;--warn:#f0b259;--warn-bg:#3a2a12;--bad:#ff8a7e;--bad-bg:#3d1b18;color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e6eeea;--paper:#0f1513;--sheet:#161e1b;--rule:#26322e;--muted:#a3b2ac;--faint:#73827c;
  --ledger:#2fae6c;--band:#145c38;--s1:var(--ledger);--s2:#d95926;--s3:#3987e5;--ok:#5fd38f;--ok-bg:#163223;--warn:#f0b259;--warn-bg:#3a2a12;--bad:#ff8a7e;--bad-bg:#3d1b18;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.5}
.wrap{margin:0;padding-left:max(clamp(16px,2vw,28px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2vw,28px),env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num,.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ledger);outline-offset:2px}

/* En-tête */
.band{background:var(--band);color:var(--on-band)}
.band-in{padding-left:max(clamp(16px,2vw,28px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2vw,28px),env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{padding-top:22px!important}
.top{padding-block:22px 16px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.brand .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-band);opacity:.78;font-weight:600}
.brand h1{font-size:clamp(22px,3.4vw,30px);font-weight:800;font-stretch:85%;margin-top:2px}
.brand .who{color:var(--on-band);opacity:.82;font-size:13.5px;margin-top:2px}
.period{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:3px}
.period button{border:0;background:none;padding:6px 11px;border-radius:7px;cursor:pointer;color:var(--on-band)}
.period button:hover{background:rgba(255,255,255,.18)}
.band .btn.primary{background:var(--on-band);color:var(--band);border-color:var(--on-band)}
.period b{font-family:var(--font-display);font-stretch:90%;min-width:150px;text-align:center;font-size:15px}
.demo{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:99px;padding:2px 10px;font-weight:600;white-space:nowrap}

/* Onglets façon intercalaires */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
@media(min-width:900px){.tabs{flex-wrap:wrap;row-gap:4px}}
.tabs a{flex:0 0 auto;padding:10px 14px 10px;text-decoration:none;color:var(--on-band);opacity:.8;font-weight:500;font-size:14px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs a:hover{opacity:1}
.tabs a.on{background:var(--paper);color:var(--ink);opacity:1;font-weight:600}
.tabs .cnt{background:var(--bad);color:#fff}
.tabs .cnt{font-family:var(--font-data);font-size:11px;border-radius:99px;padding:0 6px}

/* Blocs */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}}
@media(max-width:420px){.g4{grid-template-columns:1fr 1fr}}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px;min-width:0}
.panel h3{font-size:16px;font-weight:700;font-stretch:90%;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.sec-title{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:26px 0 10px}
.stat{padding:16px 18px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;display:flex;flex-direction:column;gap:4px;min-width:0;text-decoration:none;color:inherit}
a.stat:hover{border-color:var(--ledger)}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat .v{font-family:var(--font-display);font-stretch:85%;font-size:30px;font-weight:800;line-height:1.1}
.stat .s{font-size:12px;color:var(--faint)}
.stat.bad .v{color:var(--bad)}.stat.warn .v{color:var(--warn)}.stat.ok .v{color:var(--ok)}
.bar{height:8px;background:var(--rule);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ledger);border-radius:99px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.neutral{background:var(--ledger-soft);color:var(--ledger)}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13.5px;color:var(--ink)}
.btn:hover{border-color:var(--ledger)}
.btn.primary{background:var(--ledger);border-color:var(--ledger);color:var(--sheet)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--rule);background:var(--sheet);border-radius:7px;padding:6px 9px;font-size:13.5px;min-width:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ledger);cursor:pointer;flex:0 0 auto}

/* Listes type grand livre */
.ledger{width:100%;border-collapse:collapse;font-size:13.5px}
.ledger th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.ledger td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
.ledger tr:last-child td{border-bottom:0}
.ledger .r{text-align:right}
.ledger tr.late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.ledger tr.done td{color:var(--muted)}
.ledger tr.done .t{text-decoration:line-through;text-decoration-color:var(--faint)}
.scroll{overflow-x:auto;margin:0 -18px;padding:0 18px}
.acct{font-family:var(--font-data);font-size:12px;color:var(--ledger);background:var(--ledger-soft);border-radius:5px;padding:1px 6px;white-space:nowrap}
.cycle{margin-top:18px}
.cycle-h{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.cycle-h h3{font-size:15px}
.cycle-h .bar{flex:1;min-width:120px;max-width:260px}
.cycle-h .num{font-size:12.5px;color:var(--muted)}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 4px;border-top:1px solid var(--rule)}
.item:first-of-type{border-top:0}
.item .t{font-weight:500}
.item .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-top:2px}
.item.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.item select{font-size:12.5px;padding:3px 6px}
.item .due{font-family:var(--font-data);font-size:12px}
.list{display:flex;flex-direction:column}
.empty{color:var(--faint);font-style:italic;padding:12px 0}
.ok-txt{color:var(--ok)}.bad-txt{color:var(--bad)}.warn-txt{color:var(--warn)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.report{white-space:pre-wrap;font-family:var(--font-body);font-size:14px;line-height:1.65;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:18px;max-width:78ch;margin:0}
.plan-col h3{font-size:22px;font-weight:800;font-stretch:80%;color:var(--ledger)}
.plan-col h3 small{font-family:var(--font-body);font-size:12.5px;font-weight:500;color:var(--muted);font-stretch:100%}
.pitem{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--rule)}
.pitem label{flex:1;cursor:pointer}
.pitem.done label{color:var(--muted);text-decoration:line-through}
.addline{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addline input[type=text]{flex:1 1 200px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.foot{margin-top:34px;color:var(--faint);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:640px){.item{grid-template-columns:auto minmax(0,1fr)}.item .right{grid-column:2}.period b{min-width:120px}}
/* Graphiques et rapport */
.chart{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
.chart .gl{stroke:var(--rule);stroke-width:1}
.chart .base{stroke:var(--faint);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font-data)}
.chart .vl{fill:var(--ink);font-size:12px;font-weight:600;font-family:var(--font-data)}
.chart .refl{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.chart .xh{stroke:var(--faint);stroke-width:1;opacity:0}
.chart .hit:hover .xh{opacity:1}
.chart .hit{cursor:crosshair}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.spark{width:120px;height:34px;margin-top:4px}
.fin-tiles .stat .s{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hb{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.hb-r{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 62px;gap:10px;align-items:center;font-size:13px}
.hb-t{height:12px;background:var(--rule);border-radius:3px;overflow:hidden}
.hb-t i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.hb-v{text-align:right;color:var(--muted)}
.tip{position:fixed;z-index:20;background:var(--ink);color:var(--paper);font-size:12.5px;padding:7px 10px;border-radius:7px;max-width:300px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tw{overflow-x:auto;max-width:100%}
.fin-t input{width:74px;text-align:right;padding:4px 6px}
.fin-t td,.fin-t th{padding:5px 6px}
.report-doc{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:clamp(18px,4vw,40px)}
.rp-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:16px}
.rp-head .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ledger);font-weight:700}
.rp-head h1{font-size:clamp(26px,4vw,38px);font-weight:800;font-stretch:80%;margin-top:4px}
.rp-sec{margin-top:30px}
.rp-sec h2{font-size:19px;font-weight:800;font-stretch:85%;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:14px}
.rp-n{font-family:var(--font-data);font-size:13px;color:var(--ledger);font-weight:500}
.rp-h3{font-size:14px;font-weight:700}
.rp-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:860px){.rp-grid{grid-template-columns:1fr}}
.rp-c{max-width:78ch;color:var(--ink);margin:14px 0 0;line-height:1.65}
.rp-hl{margin-top:16px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 18px}
.rp-hl h3{font-size:14px}
.rp-hl ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rp-hl li{padding-left:14px;position:relative;line-height:1.55;max-width:90ch}
.rp-hl li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--faint)}
.ent-chip{display:inline-block;font-size:11px;font-weight:600;color:var(--ledger);background:var(--ledger-soft);border-radius:5px;padding:1px 7px;white-space:nowrap}
.ent-sel{display:flex;flex-direction:column;gap:2px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-band);opacity:.95}
.ent-sel select{background:rgba(255,255,255,.14);color:var(--on-band);border:1px solid rgba(255,255,255,.25);font-size:13.5px;font-weight:600;padding:6px 8px;border-radius:8px;text-transform:none;letter-spacing:0}
.ent-sel option{color:#14211d;background:#fff}
.mx .c{text-align:center}
.seg-sw{display:inline-flex;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg-sw button{border:0;background:none;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:500}
.seg-sw button.on{background:var(--ledger);color:var(--sheet)}
.dg-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:22px;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.dg-k{padding:18px;display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--rule);min-width:0}
.dg-k:first-child{border-left:0}
.dg-k .l{font-size:12.5px;color:var(--muted)}
.dg-k .v{font-family:var(--font-display);font-stretch:85%;font-size:clamp(24px,3vw,32px);font-weight:800;line-height:1.1}
.dg-k .s{font-size:12px;color:var(--faint);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media(max-width:760px){.dg-grid{grid-template-columns:1fr 1fr}.dg-k:nth-child(3){border-left:0}.dg-k:nth-child(n+3){border-top:1px solid var(--rule)}}
.dg-l{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;line-height:1.55}
.dg-c{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.rp-act{margin-top:3px;font-size:13px;color:var(--muted)}
.rp-act span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ledger);margin-right:8px}
.rp-dfc{background:var(--ledger-soft);border-color:transparent}
.rp-dfc li::before{background:var(--ledger)!important}
.rp-hl li.bad::before{background:var(--bad)}.rp-hl li.warn::before{background:var(--warn)}.rp-hl li.ok::before{background:var(--ok)}
.ledger tr.strong td{font-weight:700;border-top:1px solid var(--faint)}
.rp-foot{margin-top:30px;padding-top:12px;border-top:1px solid var(--rule);font-size:12px;color:var(--faint)}
@media print{.top,.tabs,.foot,.row-actions,.demo,.cmt{display:none!important}.report-doc{border:0;padding:0}.rp-sec{break-inside:avoid}body{background:#fff}}
/* Collaboration */
.as-user{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.as-user select{font-size:12.5px;padding:4px 6px}
.cmt{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);background:var(--sheet);color:var(--muted);border-radius:99px;padding:3px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.cmt:hover{border-color:var(--ledger);color:var(--ledger)}
.cmt.has{background:var(--ledger-soft);color:var(--ledger);border-color:transparent;font-weight:600}
.av{--h:150;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;flex:0 0 auto;font-size:10.5px;font-weight:700;font-family:var(--font-body);
  background:hsl(var(--h) 45% 88%);color:hsl(var(--h) 55% 24%)}
:root[data-theme="dark"] .av{background:hsl(var(--h) 30% 26%);color:hsl(var(--h) 60% 85%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av{background:hsl(var(--h) 30% 26%);color:hsl(var(--h) 60% 85%)}}
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:31;background:var(--sheet);border-left:1px solid var(--rule);display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 18px;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.dr-h{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--rule);padding-bottom:12px}
.dr-h .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ledger);font-weight:700}
.dr-h h3{font-size:16px;margin-top:2px}
.dr-list{flex:1;overflow-y:auto;padding:12px 2px;display:flex;flex-direction:column;gap:12px}
.cm{display:flex;gap:9px;align-items:flex-start}
.cm-b{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:8px 11px;min-width:0;flex:1}
.cm.mine .cm-b{background:var(--ledger-soft);border-color:transparent}
.cm-m{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.cm-m b{color:var(--ink)}
.cm-t{margin-top:3px;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}

<script>
/* ===================== Outils ===================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const pad=n=>String(n).padStart(2,'0');
const isoD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d||1);};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const pkey=(y,m)=>y+'-'+pad(m);
const pparse=k=>{const [y,m]=k.split('-').map(Number);return {y,m};};
const pshift=(k,n)=>{const {y,m}=pparse(k);const d=new Date(y,m-1+n,1);return pkey(d.getFullYear(),d.getMonth()+1);};
const plabel=k=>{const {y,m}=pparse(k);return MOIS[m-1].replace(/^./,c=>c.toUpperCase())+' '+y;};
const fmtD=s=>{if(!s)return '—';const d=parseD(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();};
const fmtDs=s=>{if(!s)return '—';const d=parseD(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1);};
const daysTo=s=>Math.round((parseD(s)-today())/864e5);
const money=n=>(n==null||n==='')?'—':Math.round(+n).toLocaleString('fr-FR').replace(/ | /g,' ');
const mshort=n=>{n=Math.abs(+n||0);return n>=1e6?(n/1e6).toLocaleString('fr-FR',{maximumFractionDigits:1})+' M':money(n);};
const uid=()=>Math.random().toString(36).slice(2,9);
/* fin du mois + n jours */
const deadlineOf=(k,n)=>{const {y,m}=pparse(k);const d=new Date(y,m,0);d.setDate(d.getDate()+n);return isoD(d);};
const dueFiscal=(k,day)=>{const {y,m}=pparse(k);const d=new Date(y,m,Math.min(day,28));d.setDate(day);return isoD(d);};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800);}

/* ===================== Référentiels ===================== */

const CLOSING=[

 {cycle:'Révision et reporting',items:[

const ALL_ITEMS=CLOSING.flatMap(c=>c.items.map(i=>({...i,cycle:c.cycle})));
/* Obligations mensuelles (période M, échéance le jour indiqué de M+1) — modifiables dans Réglages */
const FISCAL_DEFAULT=[
 {code:'TVA',lbl:'TVA',day:15,kind:'Fiscal'},

 {code:'BRS',lbl:'BRS (retenues à la source)',day:15,kind:'Fiscal'},
 {code:'IPRES',lbl:'IPRES',day:15,kind:'Social'},
 {code:'CSS',lbl:'CSS',day:15,kind:'Social'},
];

/* ===================== État (données d’exemple) ===================== */
const KEY='pcc-v6';
function seedComments(prev,t){
  const at=(d,h)=>new Date(t.getFullYear(),t.getMonth(),t.getDate()-d,h,12).toISOString();
  const c={};
  c['cl:distri:'+prev+':ve4']=[{id:'k1',who:'me',at:at(4,10),txt:'Distribution : Fatou attend la liste des litiges clients de la direction commerciale.'},
                       {id:'k2',who:'me',at:at(3,16),txt:'Relance faite. En attendant, calcul préparé sur les créances de plus de 180 jours.'}];
  c['cl:trans:'+prev+':rv2']=[{id:'k3',who:'me',at:at(2,11),txt:'Trois virements non identifiés en 471 : demander les avis de crédit détaillés à la banque.'}];
  c['tk:t2']=[{id:'k4',who:'me',at:at(1,9),txt:'Moussa : la banque n’a pas encore envoyé le détail des frais.'},
              {id:'k5',who:'me',at:at(1,15),txt:'Consigne donnée : écriture provisoire de frais, régularisation à réception du relevé.'}];
  c['rv:r2']=[{id:'k6',who:'me',at:at(5,14),txt:'Awa a relancé 12 fournisseurs, 5 factures reçues. Extourne à proposer au DFC pour le reste.'}];
  return c;
}
function seedLog(t){
  const at=(d,h,mi)=>new Date(t.getFullYear(),t.getMonth(),t.getDate()-d,h,mi).toISOString();
  return [
    {at:at(0,9,20),who:'me',txt:'Tâche « Mettre à jour la balance âgée clients » (Fatou) : en cours'},
    {at:at(1,15,2),who:'me',txt:'Note ajoutée : « Justifier l’écart Ecobank de 125 000 »'},
    {at:at(1,9,5),who:'me',txt:'Tâche « Justifier l’écart Ecobank de 125 000 » (Moussa) : bloquée'},
    {at:at(2,17,40),who:'me',txt:'« Dotations aux amortissements » validé (Ibrahima)'},
    {at:at(3,11,8),who:'me',txt:'« Lettrage des comptes fournisseurs » validé (Awa)'},
    {at:at(4,16,30),who:'me',txt:'Déclaration TVA de la période : déposée'}];
}
function seed(){
  const t=today();const cur=pkey(t.getFullYear(),t.getMonth()+1),prev=pshift(cur,-1),prev2=pshift(cur,-2);
  const OPEN={prod:['ve4','rv3'],trans:['st1','rv2','rv4'],distri:['ve3','ve4','rv4'],log:['rv4']};
  const closing={},fiscal={},fin={};
  const fdone=(k,amt)=>({done:true,at:dueFiscal(k,13),amount:Math.round(amt/1000)*1000});
  ENT_DEF.forEach(e=>{
    const c={};c[prev2]={};ALL_ITEMS.forEach(i=>c[prev2][i.id]={done:true,at:deadlineOf(prev2,i.j-1)});
    c[prev]={};ALL_ITEMS.forEach(i=>{if(!OPEN[e.id].includes(i.id))c[prev][i.id]={done:true,at:deadlineOf(prev,Math.max(1,i.j-1))};});
    closing[e.id]=c;
    fin[e.id]=seedFin(prev,e.fin);
    const f={};[prev2,prev].forEach(k=>{const F=fin[e.id][k];
      f[k]={TVA:fdone(k,F.ca*0.18*0.32),VRS:fdone(k,F.personnel*0.075),BRS:fdone(k,F.externes*0.05),IPRES:fdone(k,F.personnel*0.056),CSS:fdone(k,F.personnel*0.015)};});
    fiscal[e.id]=f;});
  closing.trans[prev].rv2={done:false,note:'Reste 3,45 M FCFA en 471 à analyser'};
  const banks=[
    {id:'b1',ent:'prod',name:'CBAO — Production',acct:'521100'},{id:'b2',ent:'prod',name:'Caisse — Production',acct:'571100'},
    {id:'b3',ent:'trans',name:'Ecobank — Transformation',acct:'521200'},{id:'b4',ent:'trans',name:'Banque Islamique — Transformation',acct:'521300'},
    {id:'b5',ent:'distri',name:'CBAO — Distribution',acct:'521100'},{id:'b6',ent:'distri',name:'Caisse — Distribution',acct:'571100'},
    {id:'b7',ent:'log',name:'Ecobank — Logistique',acct:'521200'}];
  const bal={b1:96420300,b2:1835500,b3:62480150,b4:15920000,b5:58710000,b6:2410000,b7:21305000};
  const rappro={};rappro[prev]={};rappro[prev2]={};
  banks.forEach(b=>{rappro[prev][b.id]={releve:bal[b.id],compta:bal[b.id],done:true,note:''};rappro[prev2][b.id]={releve:Math.round(bal[b.id]*0.93),compta:Math.round(bal[b.id]*0.93),done:true};});
  rappro[prev].b3={releve:62480150,compta:62355150,done:false,note:'Frais bancaires du mois en attente du relevé'};
  rappro[prev].b2.note='PV de caisse signé';
  const since=(mo,d)=>isoD(new Date(t.getFullYear(),t.getMonth()-mo,d));
  return {
    v:2,company:'',me:'',target:10,period:prev,entity:'grp',brand:'',
    entList:ENT_DEF.map(({id,name,short})=>({id,name,short})),
    team:[{id:'me',name:'Chef comptable',role:'Supervision, révision, fiscalité, consolidation'},
          {id:'m1',name:'Awa',role:'Fournisseurs — toutes activités',objectives:[{t:'Lettrage fournisseurs à jour le 7 de chaque mois',d:false},{t:'Zéro FNP de plus de 90 jours',d:false}],
            notes:[{t:'Charge élevée en fin de mois : proposer de répartir la saisie des factures sur la semaine.',at:new Date(t.getFullYear(),t.getMonth(),t.getDate()-6,10).toISOString(),by:'me'}]},
          {id:'m2',name:'Moussa',role:'Trésorerie et intra-groupe',objectives:[{t:'Rapprochements bancaires terminés à J+5',d:true},{t:'Comptes intra-groupe rapprochés à J+6',d:false}],
            notes:[{t:'Formation souhaitée sur le module banque du logiciel comptable.',at:new Date(t.getFullYear(),t.getMonth(),t.getDate()-13,11).toISOString(),by:'me'}]},
          {id:'m3',name:'Fatou',role:'Clients et ventes',objectives:[{t:'Balance âgée transmise chaque lundi',d:false}],notes:[]},
          {id:'m4',name:'Ibrahima',role:'Paie, stocks et immobilisations',objectives:[{t:'Inventaire de fin d’année planifié dans chaque activité',d:true}],notes:[]}],
    closing,fiscal,fiscalDef:FISCAL_DEFAULT.map(x=>({...x})),
    annual:[{id:'a1',lbl:'États financiers annuels SYSCOHADA (DSF) de chaque société',date:(t.getFullYear()+1)+'-04-30',done:false},
            {id:'a2',lbl:'Inventaire physique des stocks au 31/12',date:t.getFullYear()+'-12-31',done:false},
            {id:'a3',lbl:'Comptes consolidés du groupe',date:(t.getFullYear()+1)+'-06-30',done:false}],
    banks,rappro,fin,ic:seedIC(fin,prev),user:'me',
    comments:seedComments(prev,t),log:seedLog(t),
    review:[
      {id:'r1',ent:'trans',acct:'471000',lbl:'Compte d’attente — encaissements non identifiés',solde:3450000,since:since(3,10),owner:'me',action:'Identifier les clients auprès de la banque',status:'en cours'},
      {id:'r2',ent:'distri',acct:'408100',lbl:'Factures non parvenues anciennes',solde:12300000,since:since(4,28),owner:'m1',action:'Relancer les fournisseurs, extourner si nécessaire',status:'à faire'},
      {id:'r3',ent:'prod',acct:'401',lbl:'Fournisseurs à solde débiteur',solde:2150000,since:since(2,5),owner:'m1',action:'Lettrer avoirs et acomptes',status:'en cours'},
      {id:'r4',ent:'distri',acct:'411',lbl:'Clients à solde créditeur',solde:780000,since:since(1,20),owner:'m3',action:'Affecter les règlements reçus',status:'à faire'},
      {id:'r5',ent:'log',acct:'585000',lbl:'Virements de fonds non soldés',solde:500000,since:since(1,28),owner:'m2',action:'Pointer avec le relevé Ecobank',status:'à faire'},
      {id:'r6',ent:'trans',acct:'409100',lbl:'Avances fournisseurs non régularisées',solde:4800000,since:since(5,15),owner:'m1',action:'Rapprocher des factures reçues',status:'à faire'}],
    tasks:[
      {id:'t1',ent:'distri',title:'Mettre à jour la balance âgée clients',desc:'Isoler les créances de plus de 60 jours et préparer la liste de relance.',owner:'m3',due:isoD(new Date(t.getFullYear(),t.getMonth(),t.getDate()+2)),prio:'haute',status:'en cours'},
      {id:'t2',ent:'trans',title:'Justifier l’écart Ecobank de 125 000',desc:'',owner:'m2',due:isoD(new Date(t.getFullYear(),t.getMonth(),t.getDate()-1)),prio:'haute',status:'bloquée'},
      {id:'t3',ent:'',title:'Procédure écrite : circuit des factures fournisseurs',desc:'Réception, bon de commande, contrôle, saisie, validation, paiement — commune aux quatre activités.',owner:'me',due:isoD(new Date(t.getFullYear(),t.getMonth(),t.getDate()+9)),prio:'normale',status:'à faire'},
      {id:'t4',ent:'prod',title:'Tableau des immobilisations à jour',desc:'',owner:'m4',due:isoD(new Date(t.getFullYear(),t.getMonth(),t.getDate()-6)),prio:'normale',status:'terminée',doneAt:isoD(new Date(t.getFullYear(),t.getMonth(),t.getDate()-7))},
      {id:'t5',ent:'distri',title:'Comptabiliser la facture de transport Logistique (2,4 M)',desc:'Écart de rapprochement intra-groupe.',owner:'m1',due:isoD(new Date(t.getFullYear(),t.getMonth(),t.getDate()+3)),prio:'haute',status:'à faire'}].map(x=>({...x,done:x.status==='terminée',createdBy:'me',createdAt:new Date(t.getFullYear(),t.getMonth(),t.getDate()-8,9).toISOString()})),
    cac:[
      {id:'c1',item:'Confirmations bancaires au 31/12 (toutes les sociétés)',due:t.getFullYear()+'-12-15',status:'à préparer'},
      {id:'c2',item:'Circularisation clients et fournisseurs',due:t.getFullYear()+'-12-20',status:'à préparer'},
      {id:'c3',item:'Planning et instructions d’inventaire physique',due:t.getFullYear()+'-12-05',status:'en cours'},
      {id:'c4',item:'Tableau des immobilisations et des amortissements',due:(t.getFullYear()+1)+'-01-31',status:'en cours'},
      {id:'c5',item:'Rapprochement des comptes intra-groupe au 31/12',due:(t.getFullYear()+1)+'-01-15',status:'à préparer'},
      {id:'c6',item:'Procès-verbaux d’AG et de conseil',due:(t.getFullYear()+1)+'-01-31',status:'transmis'}],
    plan:{
      '30':[{t:'Rencontrer chaque comptable et cartographier la clôture de chaque activité',d:false},
            {t:'Faire l’état des lieux : comptes d’attente, écarts bancaires, comptes intra-groupe',d:false},
            {t:'Sécuriser le calendrier fiscal et social de chaque société (aucune pénalité)',d:false}],
      '60':[{t:'Une checklist de clôture commune aux quatre activités, à J+10',d:false},
            {t:'Rapprochement mensuel des flux intra-groupe avant la consolidation',d:false},
            {t:'Écrire les procédures clés : achats, ventes, paie, trésorerie, intra-groupe',d:false}],
      '90':[{t:'Clôture mensuelle tenue à J+10 et reporting consolidé standard au DFC',d:false},
            {t:'Dossier de révision prêt pour le commissaire aux comptes',d:false},
            {t:'Automatiser l’intégration des relevés bancaires (outil déjà développé)',d:false}]}
  };
}
let S;
function migrate(x){
  x.user='me';x.comments=x.comments||{};x.log=x.log||[];
  (x.tasks||[]).forEach(t=>{if(!t.status)t.status=t.done?'terminée':'à faire';t.prio=t.prio||'normale';t.desc=t.desc||'';if(t.ent==null)t.ent='';});
  (x.team||[]).forEach(m=>{m.objectives=m.objectives||[];m.notes=m.notes||[];});return x;}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const x=JSON.parse(r);if(x&&x.v===2)return migrate(x);}}catch(e){}
  const s=seed();
  /* reprise des réglages personnels de la version précédente (une seule société) */
  try{const o=JSON.parse(localStorage.getItem('pcc-v5')||'null');if(o){['company','me','target','brand','plan'].forEach(k=>{if(o[k])s[k]=o[k];});}}catch(e){}
  return s;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));$('#saved').textContent='Enregistré sur cet appareil';}catch(e){$('#saved').textContent='Modifications non enregistrées (stockage indisponible)';}}

/* ===================== Calculs ===================== */
const member=id=>S.team.find(m=>m.id===id)||{name:'—',role:''};
const closingOf=(k,eid=S.entity)=>{const c=S.closing[eid]||(S.closing[eid]={});return c[k]||(c[k]={});};
function closingStats(k){
  const items=entIds().flatMap(eid=>{const st=closingOf(k,eid);return ALL_ITEMS.map(i=>({...i,ent:eid,s:st[i.id]||{},due:deadlineOf(k,i.j)}));});
  const done=items.filter(i=>i.s.done);const open=items.filter(i=>!i.s.done);
  const late=open.filter(i=>daysTo(i.due)<0);
  return {items,done:done.length,total:items.length,pct:Math.round(done.length/items.length*100),open,late,target:deadlineOf(k,S.target)};
}

    ecartBudget:f.budget?(n(f.ca)-n(f.budget))/n(f.budget):null,

/* ---------- Points d’attention (règles) ---------- */
function attention(k){
  /* t = constat chiffré ; act = ce que fait le service comptable ; dfc = point remonté pour analyse ou décision du DFC */
  const x=kpis(k),p=kpis(pshift(k,-1)),p3=kpis(pshift(k,-3));const out=[];if(!x)return out;
  const caY=cumul(k,'ca'),buY=cumul(k,'budget'),eY=varPct(caY,buY);
  if(x.ecartBudget!=null)out.push({lvl:x.ecartBudget<-0.03?'warn':'ok',t:`Chiffre d’affaires du mois : ${P(x.ecartBudget)} par rapport au budget ; cumul : ${P(eY)}`,act:'',dfc:x.ecartBudget<-0.03||eY<-0.03?'Écart transmis pour votre analyse budgétaire.':''});
  if(p3&&x.dso-p3.dso>3)out.push({lvl:'bad',t:`Délai de paiement clients : ${J(x.dso)}, soit +${Math.round(x.dso-p3.dso)} j en 3 mois (environ ${M((x.dso-p3.dso)/30*x.ca*1.18)} M FCFA d’encours supplémentaire)`,
    act:'Balance âgée mise à jour et jointe ; relances comptables des factures échues envoyées.',dfc:'Relances commerciales et conditions de paiement des clients concernés.'});
  if(p&&varPct(x.treso,p.treso)<-0.08)out.push({lvl:'warn',t:`Trésorerie nette en baisse de ${P(-varPct(x.treso,p.treso))} sur le mois (${M(x.treso)} M FCFA)`,act:'Positions bancaires rapprochées et détaillées par compte.',dfc:'Élément pour votre prévision de trésorerie.'});
  if(x.dsi>60)out.push({lvl:'warn',t:`Stocks à ${J(x.dsi)} de consommation`,act:'Préparation de l’inventaire physique et liste des articles à faible rotation.',dfc:''});
  if(x.tEbe>=0.18)out.push({lvl:'ok',t:`EBE du mois : ${P(x.tEbe)} du chiffre d’affaires`,act:'',dfc:''});
  const rs=reviewStats();if(rs.old.length)out.push({lvl:'bad',t:`${rs.old.length} compte(s) à justifier de plus de 90 jours : ${M(rs.old.reduce((a,r)=>a+(+r.solde||0),0))} M FCFA`,
    act:'Plan de régularisation en cours, compte par compte.',dfc:'Validation des extournes et régularisations proposées avant la clôture annuelle.'});
  const gaps=bankRows(k).filter(b=>b.gap);if(gaps.length)out.push({lvl:'warn',t:`Écart bancaire non soldé : ${gaps.map(b=>money(b.gap)+' F sur '+b.name.split(' —')[0]).join(', ')}`,act:gaps.map(b=>b.x.note).filter(Boolean).join(' ; ')||'Analyse en cours.',dfc:''});
  if(isGrp()&&x.icGap)out.push({lvl:'warn',t:`Écart de rapprochement intra-groupe : ${M(x.icGap)} M FCFA`,act:icOf(k).filter(f=>f.amt!==f.buyer).map(f=>`${entOf(f.from).short} → ${entOf(f.to).short} : ${f.note||'à analyser'}`).join(' ; '),dfc:''});
  if(isGrp()){const ws=S.entList.map(e=>({e,x:entKpis(k,e.id)})).filter(r=>r.x).sort((a,b)=>a.x.tEbe-b.x.tEbe)[0];if(ws)out.push({lvl:'ok',t:`Taux d’EBE le plus bas : ${ws.e.short} (${P(ws.x.tEbe)}) ; consolidé : ${P(x.tEbe)}`,act:'',dfc:''});}
  const cs=closingStats(k);if(cs.late.length)out.push({lvl:'bad',t:`${cs.late.length} point(s) de clôture en retard sur l’objectif J+${S.target}`,act:'Finalisation en cours : '+cs.late.map(i=>i.t).join(' ; ')+'.',dfc:''});
  return out.sort((a,b)=>({bad:0,warn:1,ok:2}[a.lvl]-{bad:0,warn:1,ok:2}[b.lvl]));
}

/* ===================== Commentaires, activité, collaborateurs ===================== */
const nowISO=()=>new Date().toISOString();
const fmtTS=s=>{if(!s)return '';const d=new Date(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());};
const ago=s=>{const m=Math.round((Date.now()-new Date(s))/6e4);if(m<1)return 'à l’instant';if(m<60)return 'il y a '+m+' min';const h=Math.round(m/60);if(h<24)return 'il y a '+h+' h';const d=Math.round(h/24);return d===1?'hier':'il y a '+d+' j';};
const me=()=>member(S.user||'me');
const initials=n=>String(n||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const avatar=id=>{const m=member(id);return `<span class="av" style="--h:${(S.team.findIndex(x=>x.id===id)*67)%360}" title="${esc(m.name)}">${esc(initials(m.name))}</span>`;};
function logAct(txt,ref){S.log=S.log||[];S.log.unshift({at:nowISO(),who:S.user||'me',txt,ref:ref||null});if(S.log.length>300)S.log.length=300;}
const comments=key=>(S.comments||{})[key]||[];
const ICON_C='<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';
const cbtn=(key,title)=>{const n=comments(key).length;return `<button class="cmt ${n?'has':''}" data-cmt="${esc(key)}" data-ttl="${esc(title)}" aria-label="Notes : ${esc(title)}">${ICON_C}<span>${n?n+' note'+(n>1?'s':''):'Note'}</span></button>`;};
function bindCmts(){$$('#view [data-cmt]').forEach(b=>b.onclick=e=>{e.stopPropagation();openThread(b.dataset.cmt,b.dataset.ttl);});}
let threadKey=null,threadTitle='';
function openThread(key,title){threadKey=key;threadTitle=title;drawThread();$('#drawer').hidden=false;$('#scrim').hidden=false;setTimeout(()=>{const t=$('#cmtTxt');if(t)t.focus();},40);}
function closeThread(){$('#drawer').hidden=true;$('#scrim').hidden=true;threadKey=null;render();}
function drawThread(){
  const list=comments(threadKey);
  $('#drawer').innerHTML=`<div class="dr-h"><div style="min-width:0"><div class="eyebrow">Mes notes</div><h3>${esc(threadTitle)}</h3></div><button class="btn sm" id="drClose" aria-label="Fermer">✕</button></div>
    <div class="dr-list">${list.length?list.map(c=>`<div class="cm"><div class="cm-b"><div class="cm-m"><span>${fmtTS(c.at)}</span></div><div class="cm-t">${esc(c.txt).replace(/\n/g,'<br>')}</div></div></div>`).join(''):'<div class="empty">Aucune note. Consignez un suivi, une relance, une consigne donnée ou un point à remonter au DFC.</div>'}</div>
    <form class="dr-f" id="cmtForm"><div class="sub" style="margin:0 0 6px">Notes personnelles, visibles par vous seul.</div>
      <textarea id="cmtTxt" rows="3" placeholder="Votre note…" required></textarea>
      <div class="row-actions" style="justify-content:flex-end;margin-top:8px"><button class="btn primary" type="submit">Enregistrer</button></div></form>`;
  $('#drClose').onclick=closeThread;
  $('#cmtForm').onsubmit=e=>{e.preventDefault();const t=$('#cmtTxt').value.trim();if(!t)return;S.comments=S.comments||{};(S.comments[threadKey]=S.comments[threadKey]||[]).push({id:uid(),who:S.user||'me',at:nowISO(),txt:t});
    logAct(`Note ajoutée : « ${threadTitle} »`,threadKey);save();drawThread();const l=$('#drawer .dr-list');l.scrollTop=l.scrollHeight;toast('Note enregistrée');};
  const l=$('#drawer .dr-list');l.scrollTop=l.scrollHeight;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#drawer').hidden)closeThread();});
$('#scrim').onclick=closeThread;
/* mentions : commentaires qui citent la personne connectée */
function mentionsOf(id){const n=member(id).name.toLowerCase().split(' ')[0];const out=[];
  Object.entries(S.comments||{}).forEach(([k,l])=>l.forEach(c=>{if(c.who!==id&&c.txt.toLowerCase().includes('@'+n))out.push({...c,key:k});}));return out.sort((a,b)=>b.at.localeCompare(a.at));}
function feed(filterWho,limit=12){
  const items=[...(S.log||[]).map(l=>({at:l.at,who:l.who,html:esc(l.txt),ref:l.ref,kind:'log'}))];
  const nm=filterWho?member(filterWho).name:'';
  return items.filter(i=>!filterWho||i.html.includes(nm)).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,limit);
}
const feedHtml=list=>list.length?`<div class="feed">${list.map(i=>`<div class="fd"><span class="fd-dot" aria-hidden="true"></span><div>${i.html}<div class="fd-t">${ago(i.at)}</div></div></div>`).join('')}</div>`:'<div class="empty">Aucune action enregistrée.</div>';

/* ---------- Statistiques par collaborateur ---------- */
function memberStats(id){
  const k=S.period;let assigned=0,done=0,onTime=0,lateNow=0;
  [pshift(k,-2),pshift(k,-1),k].forEach(p=>S.entList.forEach(e=>{if(!(S.closing[e.id]||{})[p])return;const st=S.closing[e.id][p];
    ALL_ITEMS.forEach(it=>{const i={...it,ent:e.id};if(ownerOf(p,i)!==id)return;const s=st[i.id]||{};const due=deadlineOf(p,i.j);
      if(daysTo(due)>0&&!s.done)return; /* pas encore échu */
      assigned++;if(s.done){done++;if(s.at&&s.at<=due)onTime++;}else lateNow++;});}));
  const open=S.tasks.filter(t=>t.owner===id&&t.status!=='terminée');
  const tLate=open.filter(t=>t.due&&daysTo(t.due)<0);
  const tDone30=S.tasks.filter(t=>t.owner===id&&t.status==='terminée'&&t.doneAt&&(today()-parseD(t.doneAt))/864e5<=30);
  const cs=closingStats(k);const curOpen=cs.open.filter(i=>ownerOf(k,i)===id);
  const rv=S.review.filter(r=>r.owner===id&&r.status!=='soldé');
  return {assigned,done,onTime,rate:assigned?onTime/assigned:null,lateNow,open,tLate,tDone30,curOpen,rv,blocked:open.filter(t=>t.status==='bloquée')};
}

function reportText(){
  const k=S.period,cs=closingStats(k),fr=fiscalRows(k),br=bankRows(k),rs=reviewStats(),ts=taskStats();
  const per=plabel(k).toLowerCase();
  const L=[];
  L.push(`Objet : reporting comptable — clôture de ${per}`);
  L.push('À l’attention du Directeur financier et comptable');
  L.push(`Périmètre : ${entLbl()} · situation au ${fmtD(isoD(today()))}${S.company?' · '+S.company:''}`);
  const x=kpis(k),pp=kpis(pshift(k,-1));
  if(x){L.push('');L.push('Chiffres clés (millions de FCFA)');
    L.push(`- Chiffre d’affaires : ${M(x.ca)} (budget ${M(x.budget)}, écart ${P(x.ecartBudget)}) ; cumul ${M(cumul(k,'ca'))} vs budget ${M(cumul(k,'budget'))}.`);
    L.push(`- EBE : ${M(x.ebe)} soit ${P(x.tEbe)} du CA ; résultat courant avant impôt : ${M(x.rcai)}.`);
    L.push(`- Trésorerie nette : ${M(x.treso)}${pp?` (${x.treso>=pp.treso?'+':'−'}${M(Math.abs(x.treso-pp.treso))} sur le mois)`:''} ; BFR : ${M(x.bfr)}.`);
    L.push(`- Délais : clients ${J(x.dso)}, fournisseurs ${J(x.dpo)}, stocks ${J(x.dsi)}.`);
    const at=attention(k).filter(a=>a.lvl!=='ok');if(at.length){L.push('');L.push('Constats de la clôture');at.forEach(a=>L.push(`- ${a.t}.${a.act?' Action comptable : '+a.act:''}`));}
    const dd=attention(k).filter(a=>a.dfc);if(dd.length){L.push('');L.push('Points remontés pour votre analyse ou décision');dd.forEach(a=>L.push(`- ${a.dfc}`));}}
  L.push('');
  L.push(`1. Clôture comptable`);
  L.push(`Avancement : ${cs.done}/${cs.total} points (${cs.pct} %). Objectif J+${S.target} : ${fmtD(cs.target)}.`);
  if(cs.open.length)L.push('Points restants : '+cs.open.map(i=>`${i.t} (${member(ownerOf(k,i)).name}${daysTo(i.due)<0?', en retard':''})`).join(' ; ')+'.');
  else L.push('Tous les points de clôture sont réalisés.');
  L.push('');
  L.push(`2. Fiscalité et social`);
  const fd=fr.filter(r=>r.s.done),fo=fr.filter(r=>!r.s.done);
  if(fd.length)L.push(`Déposées : ${fd.map(r=>`${r.code}${r.s.amount?' '+money(r.s.amount)+' F':''}`).join(', ')}.`);
  if(fo.length)L.push(`Restent à déposer : ${fo.map(r=>`${r.code} avant le ${fmtDs(r.due)}`).join(', ')}.`);
  const tf=fr.reduce((a,r)=>a+(+r.s.amount||0),0);if(tf)L.push(`Total des impôts et cotisations de la période : ${money(tf)} FCFA.`);
  L.push('');
  L.push(`3. Trésorerie`);
  L.push(`${br.filter(b=>b.x.done).length}/${br.length} comptes rapprochés. Solde total des relevés : ${money(br.reduce((a,b)=>a+(+b.x.releve||0),0))} FCFA.`);
  br.filter(b=>b.gap).forEach(b=>L.push(`Écart de ${money(b.gap)} F sur ${b.name}${b.x.note?' : '+b.x.note:''}.`));
  L.push('');
  L.push(`4. Comptes à justifier`);
  L.push(`${rs.open.length} compte(s) pour ${money(rs.total)} FCFA, dont ${rs.old.length} de plus de 90 jours.`);
  rs.old.forEach(r=>L.push(`- ${r.acct} ${r.lbl} : ${money(r.solde)} F (${ageDays(r.since)} j) — ${r.action||'action à définir'}.`));
  L.push('');
  L.push(`5. Équipe`);
  L.push(`${ts.open.length} tâche(s) en cours${ts.late.length?', dont '+ts.late.length+' en retard : '+ts.late.map(t=>t.title+' ('+member(t.owner).name+')').join(' ; '):''}.`);
  const cacOpen=S.cac.filter(c=>c.status!=='transmis');
  if(cacOpen.length){L.push('');L.push(`6. Préparation de l’audit`);L.push(`${cacOpen.length} document(s) à remettre au commissaire aux comptes ; prochain : ${cacOpen.sort((a,b)=>a.due.localeCompare(b.due))[0].item} (${fmtD(cacOpen[0].due)}).`);}
  L.push('');
  L.push(S.me?S.me+'\nChef comptable':'Le chef comptable');
  return L.join('\n');
}

    <section class="panel" style="margin-bottom:14px">
      <h3>Mes 90 premiers jours comme chef comptable <span class="chip neutral">${d}/${all.length}</span></h3>
      <p class="sub">Objectif : des comptes fiables à J+${S.target}, des alertes remontées tôt au DFC et un dossier prêt pour l’audit. L’analyse et les décisions financières restent à la Direction financière.</p>
    </section>
    <div class="grid g3">${cols.map(([k,l])=>`<section class="panel plan-col"><h3>${k} jours <small>${l}</small></h3>
      <div style="margin-top:10px">${S.plan[k].map((p,i)=>`<div class="pitem ${p.d?'done':''}"><input type="checkbox" id="pl-${k}-${i}" data-pl="${k}" data-i="${i}" ${p.d?'checked':''}><label for="pl-${k}-${i}">${esc(p.t)}</label></div>`).join('')}</div>
      <div class="addline"><input type="text" id="pla-${k}" placeholder="Ajouter une action"><button class="btn sm" data-pladd="${k}">Ajouter</button></div></section>`).join('')}</div>`;
  $$('#view [data-pl]').forEach(cb=>cb.onchange=()=>{S.plan[cb.dataset.pl][+cb.dataset.i].d=cb.checked;save();render();});
  $$('#view [data-pladd]').forEach(b=>b.onclick=()=>{const k=b.dataset.pladd,i=$('#pla-'+k);const t=i.value.trim();if(!t){i.focus();return;}S.plan[k].push({t,d:false});save();render();});
}

let resetAsk=false;
function vReglages(){
  $('#view').innerHTML=`
    <div class="grid g2">
      <section class="panel">
        <h3>Identité</h3>
        <div style="display:grid;gap:10px;margin-top:12px">
          <label>Entreprise<br><input type="text" id="sCompany" value="${esc(S.company)}" placeholder="Nom de l’entreprise" style="width:100%"></label>
          <label>Votre nom<br><input type="text" id="sMe" value="${esc(S.me)}" placeholder="Prénom Nom" style="width:100%"></label>
          <label>Objectif de clôture (jours après la fin du mois)<br><input type="number" id="sTarget" min="3" max="30" value="${S.target}" style="width:100px"></label>
          <label>Couleur de l’entreprise<br><span class="row-actions"><input type="color" id="sBrand" value="${S.brand||'#13804b'}" style="width:56px;height:34px;padding:2px;border:1px solid var(--rule);border-radius:7px;background:var(--sheet)"><button class="btn sm" id="sBrandReset" type="button">Vert par défaut</button></span></label>
        </div>
      </section>
      <section class="panel">
        <h3>Équipe</h3>
        <div style="display:grid;gap:8px;margin-top:12px">${S.team.map(m=>`<div class="addline" style="margin:0"><input type="text" data-tm="${m.id}" data-f="name" value="${esc(m.name)}" style="flex:0 1 130px" aria-label="Nom"><input type="text" data-tm="${m.id}" data-f="role" value="${esc(m.role)}" aria-label="Rôle"></div>`).join('')}</div>
      </section>
      <section class="panel">
        <h3>Obligations mensuelles</h3>
        <p class="sub">Jour d’échéance dans le mois suivant la période.</p>
        <table class="ledger" style="margin-top:8px"><tbody>${S.fiscalDef.map((o,i)=>`<tr><td><input type="text" data-fd="${i}" data-f="lbl" value="${esc(o.lbl)}" style="width:100%" aria-label="Libellé"></td><td style="width:90px"><input type="number" min="1" max="31" data-fd="${i}" data-f="day" value="${o.day}" style="width:70px" aria-label="Jour"></td></tr>`).join('')}</tbody></table>
        <div class="addline"><input type="text" id="nfLbl" placeholder="Autre obligation (ex. Timbres)"><button class="btn sm" id="nfAdd">Ajouter</button></div>
      </section>
      <section class="panel">
        <h3>Installer sur cet appareil</h3>
        <div class="sub" style="line-height:1.6">${standalone()?'<span class="ok-txt">✓ L’application est installée sur cet appareil.</span>':
          `<b>Android (Chrome)</b> : bouton « Installer l’application » en haut, ou menu ⋮ → « Installer l’application ».<br>
           <b>iPhone (Safari)</b> : bouton Partager → « Sur l’écran d’accueil ».<br>
           <b>Ordinateur (Chrome, Edge)</b> : icône d’installation à droite de la barre d’adresse.`}</div>
      </section>
      <section class="panel">
        <h3>Données</h3>
        <p class="sub">Les données sont enregistrées dans ce navigateur. Les données d’exemple peuvent être rétablies à tout moment.</p>
        <div class="row-actions" style="margin-top:12px">${resetAsk?`<span class="confirm">Remplacer toutes vos saisies par les exemples ? <button class="btn sm danger" id="rsYes">Rétablir</button><button class="btn sm" id="rsNo">Annuler</button></span>`:'<button class="btn sm danger" id="rsAsk">Rétablir les données d’exemple</button>'}</div>
      </section>
    </div>`;
  $('#sCompany').onchange=e=>{S.company=e.target.value.trim();save();header();toast('Enregistré');};
  $('#sMe').onchange=e=>{S.me=e.target.value.trim();save();header();toast('Enregistré');};
  $('#sBrand').oninput=e=>{S.brand=e.target.value;applyBrand();};$('#sBrand').onchange=()=>{save();toast('Couleur enregistrée');};
  $('#sBrandReset').onclick=()=>{S.brand='';applyBrand();save();render();};
  $('#sTarget').onchange=e=>{S.target=Math.min(30,Math.max(3,+e.target.value||10));save();render();};
  $$('#view [data-tm]').forEach(i=>i.onchange=()=>{S.team.find(m=>m.id===i.dataset.tm)[i.dataset.f]=i.value.trim();save();toast('Équipe mise à jour');});
  $$('#view [data-fd]').forEach(i=>i.onchange=()=>{const o=S.fiscalDef[+i.dataset.fd];o[i.dataset.f]=i.dataset.f==='day'?Math.min(31,Math.max(1,+i.value||15)):i.value.trim();save();toast('Obligation mise à jour');});
  $('#nfAdd').onclick=()=>{const l=$('#nfLbl').value.trim();if(!l){$('#nfLbl').focus();return;}S.fiscalDef.push({code:l.toUpperCase().slice(0,12),lbl:l,day:15,kind:'Fiscal'});save();render();};
  const a=$('#rsAsk');if(a)a.onclick=()=>{resetAsk=true;render();};
  const y=$('#rsYes');if(y)y.onclick=()=>{S=seed();resetAsk=false;save();render();toast('Données d’exemple rétablies');};
  const n=$('#rsNo');if(n)n.onclick=()=>{resetAsk=false;render();};
}

/* ===================== Installation (PWA) ===================== */
function standalone(){try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}}
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('#installBtn').hidden=false;});
window.addEventListener('appinstalled',()=>{installEvt=null;$('#installBtn').hidden=true;toast('Application installée');});
$('#installBtn').onclick=async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice;}catch(e){}installEvt=null;$('#installBtn').hidden=true;};
if('serviceWorker' in navigator&&location.protocol==='https:'&&window.self===window.top){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}

S=load();
render();
</script>

</body>
</html>
